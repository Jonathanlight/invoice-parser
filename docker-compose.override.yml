services:
  app:
    ports:
      - "9001:9000"

  pgadmin:
    image: dpage/pgadmin4
    container_name: invoice_parser_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - symfony_network
    depends_on:
      - db
